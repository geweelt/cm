<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barcodes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<title>Barcode Lookup</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root { --bg:#f5f5f4; --card:#fff; --ink:#1c1917; --muted:#78716c; --accent:#2563eb; --line:#e7e5e4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --card:#292524; --ink:#fafaf9; --muted:#a8a29e; --accent:#60a5fa; --line:#44403c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font:16px -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink);
         padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px); overflow-x:hidden; }
  h1 { font-size:22px; margin:4px 0 12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  button, .btn { font:inherit; font-weight:600; border:0; border-radius:12px; padding:14px; width:100%;
                 background:var(--accent); color:#fff; text-align:center; display:block; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--line); }
  input[type=text], select { font:inherit; width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
                             background:var(--bg); color:var(--ink); }
  .row { display:flex; gap:8px; }
  .row input { flex:1; min-width:0; }
  .row button { width:auto; padding:12px 16px; }
  .hidden { display:none !important; }
  .video-wrap { position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:14px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .aim { position:absolute; left:12%; right:12%; top:38%; height:24%; border:2px solid rgba(255,255,255,.8);
         border-radius:10px; box-shadow:0 0 0 999px rgba(0,0,0,.25); pointer-events:none; }
  .status { font-size:14px; color:var(--muted); margin:10px 0 0; min-height:1.2em; }
  .err { color:#dc2626; }
  .field { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .field:last-child { border-bottom:0; }
  .field span:first-child { color:var(--muted); font-size:14px; }
  .field span:last-child { text-align:right; font-weight:500; word-break:break-word; }
  .match { margin-bottom:10px; }
  .checks label { display:flex; gap:10px; align-items:center; padding:8px 0; }
  .chip { display:inline-block; padding:6px 10px; margin:4px 4px 0 0; border-radius:999px; background:var(--bg);
          border:1px solid var(--line); font-size:14px; cursor:pointer; }
  .sub { font-size:13px; color:var(--muted); }
  .msg { color:var(--muted); font-size:14px; margin:8px 0 0; }
  .big { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<h1>Barcode Lookup</h1>

<div class="card" id="loadCard">
  <p class="msg" style="margin-top:0">Load your CSV once. It stays on this phone.</p>
  <label class="btn" for="csvFile">Choose CSV file</label>
  <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" class="hidden">
  <p class="msg" id="csvStatus">No file loaded.</p>
</div>

<div id="app" class="hidden">
  <div class="card">
    <div class="video-wrap" id="videoWrap">
      <video id="video" muted playsinline autoplay></video>
      <div class="aim"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="camBtn" class="secondary" style="flex:1">Stop camera</button>
    </div>
    <p class="status" id="scanStatus">Starting camera…</p>
    <div class="row" style="margin-top:10px">
      <input type="text" id="manual" placeholder="Or type a code" inputmode="numeric" autocomplete="off">
      <button id="lookupBtn">Look up</button>
    </div>
  </div>

  <div id="results"></div>

  <h2>Recent lookups</h2>
  <div class="card" id="history"><p class="msg">Nothing yet.</p></div>

  <h2>Settings</h2>
  <div class="card">
    <p class="sub" style="margin-top:0">Barcode column</p>
    <select id="barcodeCol"></select>
    <p class="sub" style="margin-top:14px">Columns to show</p>
    <div class="checks" id="showCols"></div>
    <button class="secondary" id="changeFile" style="margin-top:12px">Load a different CSV</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY_CSV = 'bcl-csv', KEY_CFG = 'bcl-cfg';
const REPEAT_MS = 3000;           // ignore the same code re-read within this window
let headers = [], rows = [], barcodeCol = 0, shownCols = [], history = [];
let reader = null, scanning = false, lastCode = '', lastAt = 0;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = (text.split(/\r?\n/)[0] || '');
  const counts = d => first.split(d).length;
  const delim = counts(';') > counts(',') ? ';' : (counts('\t') > counts(',') ? '\t' : ',');
  const out = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); out.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field.length || row.length) { row.push(field); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ''));
}

// "012345" and "12345" should match; spaces and dashes are ignored
const norm = v => {
  const s = String(v).trim().replace(/[\s-]/g, '').toUpperCase();
  return /^\d+$/.test(s) ? s.replace(/^0+(?=\d)/, '') : s;
};

function loadData(text, remember){
  const data = parseCSV(text);
  if (data.length < 2) { $('#csvStatus').innerHTML = '<span class="err">That file has no data rows.</span>'; return; }
  headers = data[0].map(h => h.trim() || '(blank)');
  rows = data.slice(1);
  if (remember) store.set(KEY_CSV, text);

  const saved = JSON.parse(store.get(KEY_CFG) || 'null');
  const guess = headers.findIndex(h => /barcode|ean|upc|gtin|sku|code/i.test(h));
  barcodeCol = saved && saved.barcodeCol < headers.length ? saved.barcodeCol : (guess >= 0 ? guess : 0);
  shownCols = saved && saved.shownCols ? saved.shownCols.filter(i => i < headers.length && i !== barcodeCol)
                                       : headers.map((_, i) => i).filter(i => i !== barcodeCol);
  buildSettings();
  $('#csvStatus').textContent = `Loaded ${rows.length} rows, ${headers.length} columns.`;
  $('#loadCard').classList.add('hidden');
  $('#app').classList.remove('hidden');
  startCamera();
}

function saveCfg(){ store.set(KEY_CFG, JSON.stringify({ barcodeCol, shownCols })); }

function buildSettings(){
  $('#barcodeCol').innerHTML = headers.map((h, i) => `<option value="${i}" ${i===barcodeCol?'selected':''}>${esc(h)}</option>`).join('');
  $('#showCols').innerHTML = headers.map((h, i) => i === barcodeCol ? '' :
    `<label><input type="checkbox" value="${i}" ${shownCols.includes(i)?'checked':''}> ${esc(h)}</label>`).join('');
}
$('#barcodeCol').addEventListener('change', e => {
  barcodeCol = +e.target.value;
  shownCols = shownCols.filter(i => i !== barcodeCol);
  buildSettings(); saveCfg();
});
$('#showCols').addEventListener('change', e => {
  const i = +e.target.value;
  shownCols = e.target.checked ? [...new Set([...shownCols, i])] : shownCols.filter(x => x !== i);
  saveCfg();
});

// ---- Live camera scanning ----
async function startCamera(){
  if (scanning) return;
  if (!window.ZXing) { setStatus('Scanner library did not load. Type codes below.', true); $('#camBtn').textContent = 'Camera unavailable'; return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('This browser cannot open the camera. Type codes below.', true); return;
  }
  try {
    reader = new ZXing.BrowserMultiFormatReader();
    scanning = true;
    $('#camBtn').textContent = 'Stop camera';
    setStatus('Point the camera at a barcode.');
    await reader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' } }, audio: false },
      $('#video'),
      (result, err) => {
        if (result) onCode(result.getText());
      }
    );
  } catch (err) {
    scanning = false;
    $('#camBtn').textContent = 'Start camera';
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    setStatus(denied ? 'Camera permission denied. Allow it in Settings > Safari > Camera, then tap Start camera.'
                     : 'Could not start the camera. Tap Start camera to retry, or type codes below.', true);
  }
}

function stopCamera(){
  if (reader) { try { reader.reset(); } catch(e){} }
  reader = null; scanning = false;
  $('#camBtn').textContent = 'Start camera';
  setStatus('Camera stopped.');
}

$('#camBtn').addEventListener('click', () => scanning ? stopCamera() : startCamera());

// Pause the camera when the app goes to the background, resume when it returns
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (scanning) stopCamera(); }
  else if (!$('#app').classList.contains('hidden') && !scanning) startCamera();
});

function setStatus(text, isErr){
  $('#scanStatus').innerHTML = isErr ? `<span class="err">${esc(text)}</span>` : esc(text);
}

function onCode(text){
  const now = Date.now();
  if (text === lastCode && now - lastAt < REPEAT_MS) return;   // same code still in view
  lastCode = text; lastAt = now;
  setStatus('Read: ' + text);
  $('#manual').value = text;
  lookup(text);
}

// ---- Lookup ----
function lookup(code){
  code = String(code || '').trim();
  if (!code) return;
  const n = norm(code);
  const matches = rows.filter(r => norm(r[barcodeCol] ?? '') === n);
  renderResults(code, matches);
  addHistory(code, matches.length);
}

function renderResults(code, matches){
  const box = $('#results');
  if (!matches.length) {
    box.innerHTML = `<div class="card"><strong>Not found</strong><p class="msg">No row has ${esc(headers[barcodeCol])} = ${esc(code)}</p></div>`;
    return;
  }
  box.innerHTML = matches.map((r, k) => `
    <div class="card match">
      ${matches.length > 1 ? `<div class="sub">Match ${k+1} of ${matches.length}</div>` : ''}
      ${shownCols.map(i => `<div class="field"><span>${esc(headers[i])}</span><span>${esc(r[i] ?? '')}</span></div>`).join('')
        || '<p class="msg">No columns selected. Pick some in Settings.</p>'}
    </div>`).join('');
}

function addHistory(code, count){
  history = [{ code, count }, ...history.filter(h => h.code !== code)].slice(0, 15);
  $('#history').innerHTML = history.map(h =>
    `<span class="chip" data-code="${esc(h.code)}">${esc(h.code)} ${h.count ? '✓' : '✗'}</span>`).join('');
}
$('#history').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (c) { $('#manual').value = c.dataset.code; lookup(c.dataset.code); }
});
$('#lookupBtn').addEventListener('click', () => lookup($('#manual').value));
$('#manual').addEventListener('keydown', e => { if (e.key === 'Enter') lookup($('#manual').value); });

// ---- CSV handling ----
$('#csvFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (file) loadData(await file.text(), true);
});
$('#changeFile').addEventListener('click', () => {
  stopCamera();
  store.del(KEY_CSV); store.del(KEY_CFG);
  $('#app').classList.add('hidden'); $('#loadCard').classList.remove('hidden');
  $('#csvStatus').textContent = 'No file loaded.'; rows = []; history = []; $('#results').innerHTML = '';
});

const savedCsv = store.get(KEY_CSV);
if (savedCsv) loadData(savedCsv, false);
</script>
</body>
</html>
