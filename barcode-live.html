<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barcodes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<title>Barcode Lookup</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root { --bg:#f5f5f4; --card:#fff; --ink:#1c1917; --muted:#78716c; --accent:#2563eb; --line:#e7e5e4; --good:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --card:#292524; --ink:#fafaf9; --muted:#a8a29e; --accent:#60a5fa; --line:#44403c; --good:#4ade80; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font:16px -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink);
         padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px); overflow-x:hidden; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:4px 0 2px; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  button, .btn { font:inherit; font-weight:600; border:0; border-radius:12px; padding:14px; width:100%;
                 background:var(--accent); color:#fff; text-align:center; display:block; cursor:pointer; }
  button.secondary, .btn.secondary { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.small { width:auto; padding:8px 12px; font-size:14px; }
  input[type=text], select { font:inherit; width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
                             background:var(--bg); color:var(--ink); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; min-width:0; }
  .row input { flex:1; min-width:0; }
  .row button { width:auto; padding:12px 16px; }
  .hidden { display:none !important; }
  .video-wrap { position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:14px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .aim { position:absolute; left:8%; right:8%; top:30%; height:40%; border:2px solid rgba(255,255,255,.8);
         border-radius:10px; box-shadow:0 0 0 999px rgba(0,0,0,.25); pointer-events:none; }
  .status { font-size:14px; color:var(--muted); margin:10px 0 0; min-height:1.2em; }
  .err { color:#dc2626; }
  .hero { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .hero div { background:var(--bg); border-radius:12px; padding:12px 10px; text-align:center; }
  .hero .lbl { font-size:13px; color:var(--muted); }
  .hero .big { font-size:34px; font-weight:800; line-height:1.15; margin-top:4px; word-break:break-word; }
  .hero .unit { color:var(--good); }
  .field { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .field:last-child { border-bottom:0; }
  .field span:first-child { color:var(--muted); font-size:14px; }
  .field span:last-child { text-align:right; font-weight:500; word-break:break-word; }
  .match { margin-bottom:10px; transition: box-shadow .2s; }
  .checks label { display:flex; gap:10px; align-items:center; padding:8px 0; }
  .chip { display:inline-block; padding:6px 10px; margin:4px 4px 0 0; border-radius:999px; background:var(--bg);
          border:1px solid var(--line); font-size:14px; cursor:pointer; }
  .sub { font-size:13px; color:var(--muted); }
  .msg { color:var(--muted); font-size:14px; margin:8px 0 0; }
  .stack > * + * { margin-top:10px; }
  /* hidden switch used to trigger a haptic tap on iPhone */
  #hapSw { position:absolute; left:-9999px; }
</style>
</head>
<body>

<div id="loadCard">
  <div class="head"><h1>Barcode Lookup</h1></div>
  <div class="card stack" style="margin-top:12px">
    <p class="sub" id="serverInfo" style="margin-top:0">Checking the server copy…</p>
    <div class="row">
      <button id="serverBtn">Load from server</button>
      <label class="btn secondary" for="csvFile">Pick file from phone</label>
    </div>
    <p class="msg" id="csvStatus">No file loaded.</p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="head">
    <h1>Barcode Lookup</h1>
    <button class="secondary small" id="replaceBtn">Replace file</button>
  </div>
  <p class="sub" id="topInfo" style="margin:4px 0 12px"></p>

  <div class="card">
    <div class="video-wrap">
      <video id="video" muted playsinline autoplay></video>
      <div class="aim"></div>
    </div>
    <canvas id="work" class="hidden"></canvas>
    <div class="row" style="margin-top:12px">
      <button id="camBtn" class="secondary">Stop camera</button>
      <button id="soundBtn" class="secondary">🔊 Sound on</button>
    </div>
    <p class="status" id="scanStatus">Starting camera…</p>
    <div class="row" style="margin-top:10px">
      <input type="text" id="manual" placeholder="Or type a code" inputmode="numeric" autocomplete="off">
      <button id="lookupBtn">Look up</button>
    </div>
  </div>

  <div id="results"></div>

  <h2>Recent lookups</h2>
  <div class="card" id="history"><p class="msg">Nothing yet.</p></div>

  <h2>Settings</h2>
  <div class="card stack">
    <button class="secondary" id="reloadBtn">Reload file from server</button>
    <div>
      <p class="sub">Barcode column</p>
      <select id="barcodeCol"></select>
    </div>
    <div>
      <p class="sub">Price column (used for price per 100 gr/ml)</p>
      <select id="priceCol"></select>
    </div>
    <div>
      <p class="sub">Columns to show</p>
      <div class="checks" id="showCols"></div>
    </div>
    <button class="secondary" id="changeFile">Forget loaded file and start over</button>
  </div>
</div>

<input type="file" id="csvFile" accept=".csv,.xlsx,.xls,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="hidden">
<input type="checkbox" id="hapSw" switch tabindex="-1" aria-hidden="true">
<label for="hapSw" id="hapLbl" class="hidden"></label>

<script>
const $ = s => document.querySelector(s);
const SERVER_FILE = 'prices.xlsx';   // must sit next to this page
const KEY_DATA = 'bcl-data', KEY_CFG = 'bcl-cfg';
const REPEAT_MS = 3000;            // ignore the same code re-read within this window
const WEIGHT_RE = /תכולה/;         // content (weight/volume) column
const PRICE_RE = /מחיר|price/i;    // price column guess
const ANGLES = [0, 45, 90, 135, 180, 225, 270, 315];   // fallback rotations, used when no clear barcode direction is found

const savedCfg = JSON.parse(localStorage.getItem(KEY_CFG) || 'null') || {};
let headers = [], rows = [], barcodeCol = 0, priceCol = -1, shownCols = [], history = [];
let soundOn = savedCfg.sound !== false;
let stream = null, scanning = false, rafId = null, lastTick = 0, frameNo = 0;
let lastCode = '', lastAt = 0, audioCtx = null, beepEl = null;
let rememberNote = '';
let serverPromise = null;          // cached download of the server file

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ localStorage.setItem(k,v); },   // may throw if too big; callers catch
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- Codes: strip ~, spaces, dashes and leading zeros so 012345 and 12345 are the same ----
const cleanCode = v => {
  const s = String(v).trim().replace(/^~+/, '').replace(/[\s-]/g, '').toUpperCase();
  return /^\d+$/.test(s) ? s.replace(/^0+(?=\d)/, '') : s;
};

// Numbers may use a comma as decimal separator
const parseNum = v => parseFloat(String(v ?? '').replace(',', '.').replace(/[^\d.\-]/g, ''));

const fmtDate = d => (d instanceof Date && !isNaN(d))
  ? d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : null;

// ---- Reading files ----
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = (text.split(/\r?\n/)[0] || '');
  const counts = d => first.split(d).length;
  const delim = counts(';') > counts(',') ? ';' : (counts('\t') > counts(',') ? '\t' : ',');
  const out = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); out.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field.length || row.length) { row.push(field); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ''));
}

// UTF-8 if valid, otherwise Windows-1255 (Hebrew, typical for Excel exports)
function decodeText(buf){
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1255').decode(buf); }
}

// Returns { data: rows of strings, updated: Date|null } from an xlsx/xls/csv buffer
function parseSpreadsheet(buf, name){
  if (/\.(xlsx|xls)$/i.test(name)) {
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    // raw:false keeps numbers as displayed, so long codes don't become 1.23E+12
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false })
                       .map(r => r.map(v => String(v)));
    const mod = wb.Props && wb.Props.ModifiedDate ? new Date(wb.Props.ModifiedDate) : null;
    return { data, updated: mod };
  }
  return { data: parseCSV(decodeText(buf)), updated: null };
}

// Shows a message on the load screen and in the top line of the main screen
function setLoadMsg(text, isErr){
  const html = isErr ? `<span class="err">${esc(text)}</span>` : esc(text);
  $('#csvStatus').innerHTML = html;
  $('#topInfo').innerHTML = html;
}

// info: { source: 'server' | 'phone', updated: string | null, name }
function loadData(data, info, remember){
  if (!data || data.length < 2) { setLoadMsg('That file has no data rows.', true); return; }
  headers = data[0].map(h => String(h).trim() || '(blank)');
  rows = data.slice(1);
  rememberNote = '';
  if (remember) {
    try { store.set(KEY_DATA, JSON.stringify({ data, info })); }
    catch (e) { rememberNote = ' Too big to save for next time; load it again after closing the app.'; }
  }

  const saved = JSON.parse(store.get(KEY_CFG) || 'null');
  const guessBar = headers.findIndex(h => /barcode|ean|upc|gtin|sku|code|ברקוד|מק"?ט/i.test(h));
  const guessPrice = headers.findIndex(h => PRICE_RE.test(h));
  barcodeCol = saved && saved.barcodeCol < headers.length ? saved.barcodeCol : (guessBar >= 0 ? guessBar : 0);
  priceCol = saved && 'priceCol' in saved ? (saved.priceCol < headers.length ? saved.priceCol : -1) : guessPrice;
  shownCols = saved && saved.shownCols ? saved.shownCols.filter(i => i < headers.length && i !== barcodeCol)
                                       : headers.map((_, i) => i).filter(i => i !== barcodeCol);
  buildSettings();

  const where = info.source === 'server' ? `Server file ${SERVER_FILE}` : (info.name || 'File from this phone');
  const upd = info.updated ? ` · last updated ${info.updated}` : '';
  setLoadMsg(`${where}: ${rows.length} rows, ${headers.length} columns${upd}.${rememberNote}`, false);
  $('#loadCard').classList.add('hidden');
  $('#app').classList.remove('hidden');
  startCamera();
}

function saveCfg(){ store.set(KEY_CFG, JSON.stringify({ barcodeCol, priceCol, shownCols, sound: soundOn })); }

function buildSettings(){
  $('#barcodeCol').innerHTML = headers.map((h, i) => `<option value="${i}" ${i===barcodeCol?'selected':''}>${esc(h)}</option>`).join('');
  $('#priceCol').innerHTML = `<option value="-1" ${priceCol<0?'selected':''}>None</option>` +
    headers.map((h, i) => `<option value="${i}" ${i===priceCol?'selected':''}>${esc(h)}</option>`).join('');
  $('#showCols').innerHTML = headers.map((h, i) => i === barcodeCol ? '' :
    `<label><input type="checkbox" value="${i}" ${shownCols.includes(i)?'checked':''}> ${esc(h)}</label>`).join('');
}
$('#barcodeCol').addEventListener('change', e => {
  barcodeCol = +e.target.value;
  shownCols = shownCols.filter(i => i !== barcodeCol);
  buildSettings(); saveCfg();
});
$('#priceCol').addEventListener('change', e => {
  priceCol = +e.target.value;
  saveCfg();
});
$('#showCols').addEventListener('change', e => {
  const i = +e.target.value;
  shownCols = e.target.checked ? [...new Set([...shownCols, i])] : shownCols.filter(x => x !== i);
  saveCfg();
});

// ---- Server file: downloaded once when the page opens, reused when the user taps Load ----
function fetchServer(){
  if (!serverPromise) {
    serverPromise = (async () => {
      const res = await fetch(SERVER_FILE, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const { data, updated } = parseSpreadsheet(await res.arrayBuffer(), SERVER_FILE);
      // Use the date saved inside the file; fall back to the server's Last-Modified header
      const hdr = res.headers.get('Last-Modified');
      const when = updated || (hdr ? new Date(hdr) : null);
      return { data, updated: fmtDate(when) };
    })().catch(err => { serverPromise = null; throw err; });   // allow a retry after a failure
  }
  return serverPromise;
}

function showServerInfo(){
  fetchServer()
    .then(s => { $('#serverInfo').textContent = `Server file ${SERVER_FILE}: last updated ${s.updated || 'date unknown'}`; })
    .catch(() => { $('#serverInfo').textContent = `No ${SERVER_FILE} found on the server.`; });
}

async function loadFromServer(){
  setLoadMsg('Loading from server…', false);
  try {
    const s = await fetchServer();
    loadData(s.data, { source: 'server', updated: s.updated }, false);
  } catch (err) {
    setLoadMsg(`Could not load ${SERVER_FILE} from the server. Check that it sits next to this page, or pick a file from this phone.`, true);
  }
}

$('#serverBtn').addEventListener('click', () => { unlockFeedback(); loadFromServer(); });
$('#reloadBtn').addEventListener('click', () => {
  unlockFeedback();
  serverPromise = null;          // force a fresh download
  loadFromServer().then(showServerInfo);
});
// "Replace file": pick a new file from the phone and use it from now on
$('#replaceBtn').addEventListener('click', () => $('#csvFile').click());

$('#csvFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const { data, updated } = parseSpreadsheet(await file.arrayBuffer(), file.name);
    loadData(data, { source: 'phone', updated: fmtDate(updated), name: file.name }, true);
  } catch (err) { setLoadMsg('Could not read that file. Try saving it as CSV or XLSX.', true); }
});

// ---- Sound and feedback ----
// Sound: iPhone web pages cannot play through the silent switch. The beep plays only when the phone is not muted.
function makeBeepUrl(){
  const rate = 22050, secs = 0.08, n = Math.floor(rate * secs), freq = 900;
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const wr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wr(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); wr(8, 'WAVE'); wr(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wr(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const env = Math.max(0, 1 - i / n);
    const s = Math.sin(2 * Math.PI * freq * i / rate) * env * 0.6;
    v.setInt16(44 + i * 2, s * 32767, true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

function unlockFeedback(){
  try {
    if (!beepEl) { beepEl = new Audio(makeBeepUrl()); beepEl.preload = 'auto'; }
    // Playing once inside a tap unlocks later plays
    beepEl.play().then(() => { beepEl.pause(); beepEl.currentTime = 0; }).catch(() => {});
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockFeedback);

function beep(){
  if (!soundOn) return;
  if (beepEl) {
    beepEl.currentTime = 0;
    const p = beepEl.play();
    if (p && p.catch) p.catch(() => webBeep());
  } else webBeep();
}
function webBeep(){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.value = 900;
  gain.gain.setValueAtTime(0.3, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.09);
}

function updateSoundBtn(){
  $('#soundBtn').textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
}
$('#soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  updateSoundBtn(); saveCfg();
  if (soundOn) { unlockFeedback(); beep(); }
});
updateSoundBtn();

function haptic(){
  // Toggling a switch control gives a light tap on recent iPhones, even in silent mode (best effort)
  try { $('#hapLbl').click(); } catch (e) {}
}

function flash(){
  const el = document.querySelector('#results .match');
  if (el && el.animate) el.animate([
    { boxShadow: '0 0 0 6px #22c55e' }, { boxShadow: '0 0 0 0 rgba(34,197,94,0)' }
  ], { duration: 700 });
}

// ---- Live scanning: decode frames with ZXing, trying the image at several angles ----
const hints = new Map();
let zreader = null;
function setupReader(){
  if (zreader || !window.ZXing) return;
  const F = ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  zreader = new ZXing.MultiFormatReader();
  zreader.setHints(hints);
}

const video = $('#video');
const work = $('#work'), wctx = work.getContext('2d', { willReadFrequently: true });
// The work canvas is a square big enough to hold the video at any rotation
function decodeFrame(angle){
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const S = Math.ceil(Math.hypot(vw, vh));
  if (work.width !== S) { work.width = S; work.height = S; }
  wctx.fillStyle = '#000';
  wctx.fillRect(0, 0, S, S);
  wctx.save();
  wctx.translate(S / 2, S / 2);
  wctx.rotate(angle * Math.PI / 180);
  wctx.drawImage(video, -vw / 2, -vh / 2, vw, vh);
  wctx.restore();
  try {
    const src = new ZXing.HTMLCanvasElementLuminanceSource(work);
    const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
    return zreader.decode(bitmap).getText();
  } catch (e) {
    return null;   // nothing readable at this angle
  }
}

async function startCamera(){
  if (scanning) return;
  unlockFeedback();
  if (!window.ZXing) { setStatus('Scanner library did not load. Type codes below.', true); $('#camBtn').textContent = 'Camera unavailable'; return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('This browser cannot open the camera. Type codes below.', true); return;
  }
  try {
    setupReader();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    $('#camBtn').textContent = 'Stop camera';
    setStatus('Point the camera at a barcode. Hold steady.');
    rafId = requestAnimationFrame(loop);
  } catch (err) {
    stopStream();
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    setStatus(denied ? 'Camera permission denied. Allow it in Settings > Safari > Camera, then tap Start camera.'
                     : 'Could not start the camera. Tap Start camera to retry, or type codes below.', true);
    $('#camBtn').textContent = 'Start camera';
  }
}

// Finds the dominant edge direction in a small grayscale copy of the frame (structure tensor).
// Barcode bars give a strong, consistent direction; the decoder needs its scan lines across the bars.
const small = document.createElement('canvas');
const sctx = small.getContext('2d', { willReadFrequently: true });
function detectOrientation(){
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return { angle: 0, coherence: 0 };
  const w = 320, h = Math.round(320 * vh / vw);
  if (small.width !== w || small.height !== h) { small.width = w; small.height = h; }
  sctx.drawImage(video, 0, 0, w, h);
  const d = sctx.getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = 0.299 * d[4*i] + 0.587 * d[4*i+1] + 0.114 * d[4*i+2];
  let Jxx = 0, Jyy = 0, Jxy = 0;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const gx = g[i+1] - g[i-1], gy = g[i+w] - g[i-w];
      Jxx += gx * gx; Jyy += gy * gy; Jxy += gx * gy;
    }
  }
  const dominant = 0.5 * Math.atan2(2 * Jxy, Jxx - Jyy);      // direction of the strongest edges
  const total = Jxx + Jyy;
  const coherence = total > 0 ? Math.hypot(Jxx - Jyy, 2 * Jxy) / total : 0;
  // Rotate so the strongest edges are vertical, i.e. the scan lines run across the bars
  return { angle: -dominant * 180 / Math.PI, coherence };
}

function loop(now){
  if (!scanning) return;
  rafId = requestAnimationFrame(loop);
  if (now - lastTick < 100 || video.readyState < 2) return;   // about 10 checks per second
  lastTick = now;
  const det = detectOrientation();
  // Clear direction found: try that angle and two close neighbours. Otherwise try every fallback angle in turn.
  const angles = det.coherence > 0.2 ? [det.angle, det.angle + 12, det.angle - 12] : ANGLES;
  const angle = angles[frameNo++ % angles.length];
  const text = decodeFrame(angle);
  if (text) onCode(text);
}

function stopStream(){
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null;
  scanning = false;
}

function stopCamera(){
  stopStream();
  $('#camBtn').textContent = 'Start camera';
  setStatus('Camera stopped.');
}

$('#camBtn').addEventListener('click', () => scanning ? stopCamera() : startCamera());

// Pause the camera when the app goes to the background, resume when it returns
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (scanning) stopCamera(); }
  else if (!$('#app').classList.contains('hidden') && !scanning) startCamera();
});

function setStatus(text, isErr){
  $('#scanStatus').innerHTML = isErr ? `<span class="err">${esc(text)}</span>` : esc(text);
}

function onCode(text){
  const code = cleanCode(text);
  const now = Date.now();
  if (code === lastCode && now - lastAt < REPEAT_MS) return;   // same code still in view
  lastCode = code; lastAt = now;
  beep();
  haptic();
  setStatus('Read: ' + code);
  $('#manual').value = code;
  lookup(code);
  flash();
}

// ---- Lookup ----
function lookup(input){
  const code = cleanCode(input || '');
  if (!code) return;
  const matches = rows.filter(r => cleanCode(r[barcodeCol] ?? '') === code);
  renderResults(code, matches);
  addHistory(code, matches.length);
}

// Price per 100 gr/ml = price / content * 100, using the content (תכולה) column
function pricePer100(r){
  const wIdx = headers.findIndex(h => WEIGHT_RE.test(h));
  if (wIdx < 0 || priceCol < 0) return null;
  const w = parseNum(r[wIdx]), p = parseNum(r[priceCol]);
  if (!(w > 0) || Number.isNaN(p) || p < 0) return null;
  return (p / w * 100).toFixed(2);
}

function renderResults(code, matches){
  const box = $('#results');
  if (!matches.length) {
    box.innerHTML = `<div class="card"><strong>Not found</strong><p class="msg">No row has ${esc(headers[barcodeCol])} = ${esc(code)}</p></div>`;
    return;
  }
  box.innerHTML = matches.map((r, k) => {
    // Big summary at the top: price and price per 100 gr/ml
    const unit = pricePer100(r);
    const priceRaw = priceCol >= 0 ? String(r[priceCol] ?? '').trim() : '';
    let hero = '';
    if (priceCol >= 0) {
      hero = `<div class="hero">
        <div><div class="lbl">${esc(headers[priceCol])}</div><div class="big">${esc(priceRaw || '—')}</div></div>
        <div><div class="lbl">Per 100 gr/ml</div><div class="big unit">${unit !== null ? esc(unit) : '—'}</div></div>
      </div>`;
    }
    // Detail rows: every shown column except the price (already in the summary)
    const details = shownCols.filter(i => i !== priceCol).map(i =>
      `<div class="field"><span>${esc(headers[i])}</span><span>${esc(String(r[i] ?? '').trim())}</span></div>`).join('');
    return `
    <div class="card match">
      ${matches.length > 1 ? `<div class="sub">Match ${k+1} of ${matches.length}</div>` : ''}
      ${hero}
      ${details || (hero ? '' : '<p class="msg">No columns selected. Pick some in Settings.</p>')}
    </div>`;
  }).join('');
}

function addHistory(code, count){
  history = [{ code, count }, ...history.filter(h => h.code !== code)].slice(0, 15);
  $('#history').innerHTML = history.map(h =>
    `<span class="chip" data-code="${esc(h.code)}">${esc(h.code)} ${h.count ? '✓' : '✗'}</span>`).join('');
}
$('#history').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (c) { $('#manual').value = c.dataset.code; lookup(c.dataset.code); }
});
$('#lookupBtn').addEventListener('click', () => lookup($('#manual').value));
$('#manual').addEventListener('keydown', e => { if (e.key === 'Enter') lookup($('#manual').value); });

$('#changeFile').addEventListener('click', () => {
  stopCamera();
  store.del(KEY_DATA); store.del(KEY_CFG);
  $('#app').classList.add('hidden'); $('#loadCard').classList.remove('hidden');
  setLoadMsg('No file loaded.', false);
  rows = []; history = []; $('#results').innerHTML = '';
});

// On open: check the server copy and show its date on the load screen.
// If a phone file was saved earlier, restore it; otherwise wait for the user to tap a load button.
showServerInfo();
const storedRaw = store.get(KEY_DATA);
if (storedRaw) {
  try {
    const stored = JSON.parse(storedRaw);
    // Older saves were a bare array of rows
    if (Array.isArray(stored)) loadData(stored, { source: 'phone', updated: null }, false);
    else loadData(stored.data, stored.info || { source: 'phone', updated: null }, false);
  } catch (e) { store.del(KEY_DATA); }
}
</script>
</body>
</html>
